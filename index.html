<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Магазин</h1>
      <nav>
        Навигация
        <a href="#products">Товары</a>
        <a href="#cart">Корзина</a>
      </nav>
    </header>

    <h1>Товары</h1>
    <div id="products"></div>

    <h1>Корзина</h1>
    <div id="cart"></div>

    <button id="open-form-btn">Оформить заказ</button>

    <div id="form-modal" class="form-modal">
      <div class="form-content">
        <form>
          <label for="fname">Имя:</label> <br />
          <input
            type="text"
            id="fname"
            name="fname"
            placeholder="Петр"
            required
          /><br /><br />
          <label for="lname">Фамилия:</label> <br />
          <input
            type="text"
            id="lname"
            name="lname"
            placeholder="Петров"
            required
          /><br /><br />
          <label for="delivery-address">Адрес доставки:</label> <br />
          <input
            type="text"
            id="delivery-address"
            name="fname"
            placeholder="ул. Пушкина, д. Колотушкина"
            required
          /><br /><br />
          <label for="phone-number">Контактный номер телефона:</label> <br />
          <input
            type="text"
            id="phone-number"
            name="lname"
            placeholder="88005553535"
            required
          /><br /><br />
          <input id="create-order-btn" type="submit" value="Создать заказ" />
        </form>
      </div>
    </div>

    <div id="order-created-modal" class="order-created-modal">
      <div class="order-created-content">Заказ создан!</div>
    </div>

    <footer>Самый лучший магазин.</footer>
    <script src="script.js"></script>
  </body>
</html>
